<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
  <meta http-equiv='cache-control' content='no-cache'> 
  <meta http-equiv='expires' content='0'> 
  <meta http-equiv='pragma' content='no-cache'>
  <title>GDTW Demonlist</title>
  <link href="style.css" rel="stylesheet" type="text/css">
  <link rel="icon" href="icon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,1,0">
  <base target="_blank">
</head>
<!-- Select Menu -->

<body id="leaderboard" style="overflow: hidden; overflow-x: hidden;">
  <div id="menuContainer"></div>
  <div class="loaderContainer">
    <div class="loader"></div>
    <p><br><br>Loading</p>
  </div>
  <div class="content leaderboard" style="opacity:0">
    <div id="player-container" style="flex: 50%;">
      <div id="player"></div>
    </div>
    <span id="leaderboard-border"></span>
    <div id="player-detail-container" style="flex: 50%;">
      <div id="player-detail"></div>
    </div>
  </div>
  <div class="content mobile-leaderboard" style="opacity:0; position: relative">
    <div id="mobile-player"></div>
  </div>
  <div id="mobile-detail-container">
    <div id="mobile-modal">
      <div style="height: 40px;">
        <span id="modal-close">
          <span class="material-symbols-outlined" style="color: var(--text-default); font-size: 35px;">
            close
          </span>
        </span>
      </div>
      <div id="mobile-detail"></div>
    </div>
  </div>
  <!-- End -->
  <address class="addr">
    Website by Mars
  </address>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="menu.js"></script>
  <script src="classical-exd.js"></script>
  <script src="cookie.js"></script>
</body>

</html>
