<!DOCTYPE html>
<html>
    <head>
        <title>Random Opener</title>
        <link rel="icon" href="icon.ico">
    </head>
    <style>
        #reroll {
            width: 150px;
            height: 50px;
            background-color: rgb(166, 126, 196);
            border: none;

            font-size: 20px;
            font-weight: bold;
            color: rgb(28, 28, 28);

            transition: background-color 0.2s, width 0.2s cubic-bezier(0.65, 0, 0.35, 1);
        }

        #reroll:hover {
            background-color: rgb(0, 112, 104);
        }
    </style>
    <body style="margin: 0; background-color: rgb(70, 37, 65); user-select: none; -webkit-user-select: none;">
        <div id="word" style="text-align: center; width: 100%; margin-top: 40vb; font-size: 80px; font-family: 'Courier New', Courier, monospace; font-weight: 700; color: #ff93dd"></div>
        <div id="date" style="position: absolute; text-align: center; top: 50%; left: 50%; transform: translateY(calc(-50% + 80px)) translateX(-50%); font-size: 20px; font-family: 'Courier New', Courier, monospace; font-weight: 700; color: #ff93dd"></div>
        <div style="position: absolute; bottom: 150px; width: 100%; text-align: center;">
            <button id="reroll" onclick="Reroll()">重新生成</button>
        </div>
        <div style="position: absolute; bottom: 100px; width: 100%; text-align: center;">
            <input type="checkbox" id="hard" name="hard" value="hard">
            <label for="hard" style="color: white;">困難模式</label>
        </div>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script>
            let list = [];
            // read list
            fetch("valid-wordle-words.txt")
                .then(response => response.text())
                .then(text => {
                    let temp = text.split("\n");
                    for (let line of temp) {
                        let pair = line.split(" ");
                        list.push(pair);
                    }
                    DisplayWord(GenerateWord());
                });
            
            function Reroll() {
                let word = GenerateWord($("#hard").is(":checked"));
                DisplayWord(word);
            }
            
            function GenerateWord(hard = false) {
                // generate opener
                let n = hard ? Math.floor(Math.random() * (list.length - 1) * 1/10 + (list.length - 1) * 9/10) : Math.floor(Math.random() * (list.length - 1));
                //console.log(n);
                return list[n][0];
            }

            function DisplayWord(word) {
                $("#word").html(word);

                // get current time
                let now = new Date();
                let D = String(now.getDate()).padStart(2, "0");
                let M = String(now.getMonth() + 1).padStart(2, "0");
                let Y = now.getFullYear();
                let h = String(now.getHours()).padStart(2, "0");
                let m = String(now.getMinutes()).padStart(2, "0");
                let s = String(now.getSeconds()).padStart(2, "0");
                let timestr = Y + "/" + M + "/" + D + ", " + h + ":" + m + ":" + s;

                $("#date").html("生成時間：" + timestr);
            }
        </script>
    </body>
</html>
